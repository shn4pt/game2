<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          boxShadow: {
            neon: "0 0 18px rgba(34, 211, 238, 0.45)"
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background:
        radial-gradient(circle at top, rgba(34,197,94,0.15), transparent 30%),
        radial-gradient(circle at bottom, rgba(59,130,246,0.15), transparent 35%),
        #020817;
      min-height: 100vh;
    }

    .game-grid {
      background:
        linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(3, 7, 18, 1));
      box-shadow: 0 0 30px rgba(45, 212, 191, 0.18);
    }

    .cell {
      width: 26px;
      height: 26px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.85);
    }

    @media (max-width: 640px) {
      .cell {
        width: 22px;
        height: 22px;
      }
    }

    .touch-btn {
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const BOARD_WIDTH = 10;
    const BOARD_HEIGHT = 20;
    const STORAGE_KEY = "tetris-save-v1";
    const BEST_SCORE_KEY = "tetris-best-score-v1";

    const PIECES = {
      I: [[1, 1, 1, 1]],
      O: [[1, 1], [1, 1]],
      T: [[0, 1, 0], [1, 1, 1]],
      S: [[0, 1, 1], [1, 1, 0]],
      Z: [[1, 1, 0], [0, 1, 1]],
      J: [[1, 0, 0], [1, 1, 1]],
      L: [[0, 0, 1], [1, 1, 1]]
    };

    const COLORS = {
      I: "bg-cyan-400 shadow-neon border-cyan-200",
      O: "bg-yellow-400 shadow-neon border-yellow-200",
      T: "bg-violet-400 shadow-neon border-violet-200",
      S: "bg-green-400 shadow-neon border-green-200",
      Z: "bg-red-400 shadow-neon border-red-200",
      J: "bg-blue-500 shadow-neon border-blue-200",
      L: "bg-orange-400 shadow-neon border-orange-200"
    };

    function createEmptyBoard(width = BOARD_WIDTH, height = BOARD_HEIGHT) {
      return Array.from({ length: height }, () => Array(width).fill(null));
    }

    function cloneBoard(board) {
      return board.map(row => [...row]);
    }

    function getRandomType() {
      const types = Object.keys(PIECES);
      return types[Math.floor(Math.random() * types.length)];
    }

    function createPiece(type = getRandomType()) {
      const matrix = PIECES[type].map(row => [...row]);
      return { type, matrix, x: Math.floor((BOARD_WIDTH - matrix[0].length) / 2), y: -1 };
    }

    function collides(board, piece, offsetX = 0, offsetY = 0) {
      for (let y = 0; y < piece.matrix.length; y++) {
        for (let x = 0; x < piece.matrix[y].length; x++) {
          if (!piece.matrix[y][x]) continue;
          const newX = piece.x + x + offsetX;
          const newY = piece.y + y + offsetY;
          if (newX < 0 || newX >= BOARD_WIDTH || newY >= BOARD_HEIGHT) return true;
          if (newY >= 0 && board[newY][newX]) return true;
        }
      }
      return false;
    }

    function mergePiece(board, piece) {
      const newBoard = cloneBoard(board);
      for (let y = 0; y < piece.matrix.length; y++) {
        for (let x = 0; x < piece.matrix[y].length; x++) {
          if (!piece.matrix[y][x]) continue;
          const boardY = piece.y + y;
          const boardX = piece.x + x;
          if (boardY >= 0 && boardY < BOARD_HEIGHT && boardX >= 0 && boardX < BOARD_WIDTH) {
            newBoard[boardY][boardX] = piece.type;
          }
        }
      }
      return newBoard;
    }

    function rotateMatrix(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          rotated[x][rows - 1 - y] = matrix[y][x];
        }
      }
      return rotated;
    }

    function clearLines(board) {
      const remaining = board.filter(row => row.some(cell => cell === null));
      const cleared = BOARD_HEIGHT - remaining.length;
      while (remaining.length < BOARD_HEIGHT) {
        remaining.unshift(Array(BOARD_WIDTH).fill(null));
      }
      return { board: remaining, clearedLines: cleared };
    }

    function scoreForLines(lines) {
      const table = { 1: 100, 2: 300, 3: 500, 4: 800 };
      return table[lines] || 0;
    }

    function getInitialGameState() {
      const saved = (() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      })();

      const best = (() => {
        try {
          const raw = localStorage.getItem(BEST_SCORE_KEY);
          return raw ? Number(raw) : 0;
        } catch {
          return 0;
        }
      })();

      if (saved && saved.board && saved.current && saved.next) {
        return { ...saved, best: Math.max(best, Number(saved.best || best)) };
      }

      return {
        board: createEmptyBoard(),
        current: createPiece(),
        next: createPiece(),
        score: 0,
        lines: 0,
        level: 1,
        status: "running",
        best
      };
    }

    function lockAndSpawn(prevState, lockedPiece) {
      const mergedBoard = mergePiece(prevState.board, lockedPiece);
      const { board: clearedBoard, clearedLines } = clearLines(mergedBoard);

      const nextCurrent = createPiece(prevState.next.type);
      const nextNext = createPiece();

      const newScore = prevState.score + scoreForLines(clearedLines) * prevState.level;
      const newLines = prevState.lines + clearedLines;
      const newLevel = Math.floor(newLines / 10) + 1;
      const status = collides(clearedBoard, nextCurrent) ? "gameover" : "running";
      const best = Math.max(prevState.best || 0, newScore);

      return {
        ...prevState,
        board: clearedBoard,
        current: nextCurrent,
        next: nextNext,
        score: newScore,
        lines: newLines,
        level: newLevel,
        status,
        best
      };
    }

    function App() {
      const [game, setGame] = useState(() => getInitialGameState());

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(game));
          localStorage.setItem(BEST_SCORE_KEY, String(game.best || 0));
        } catch (e) {
          console.warn("LocalStorage not available:", e);
        }
      }, [game]);

      const moveLeft = () => {
        setGame(prev => {
          if (prev.status !== "running") return prev;
          const moved = { ...prev.current, x: prev.current.x - 1 };
          if (!collides(prev.board, moved)) {
            return { ...prev, current: moved };
          }
          return prev;
        });
      };

      const moveRight = () => {
        setGame(prev => {
          if (prev.status !== "running") return prev;
          const moved = { ...prev.current, x: prev.current.x + 1 };
          if (!collides(prev.board, moved)) {
            return { ...prev, current: moved };
          }
          return prev;
        });
      };

      const softDrop = () => {
        setGame(prev => {
          if (prev.status !== "running") return prev;
          const moved = { ...prev.current, y: prev.current.y + 1 };
          if (!collides(prev.board, moved)) {
            return { ...prev, current: moved };
          }
          return lockAndSpawn(prev, prev.current);
        });
      };

      const rotate = () => {
        setGame(prev => {
          if (prev.status !== "running") return prev;
          const rotated = rotateMatrix(prev.current.matrix);
          const kickOffsets = [0, -1, 1, -2, 2];
          for (const offset of kickOffsets) {
            const candidate = { ...prev.current, matrix: rotated, x: prev.current.x + offset };
            if (!collides(prev.board, candidate)) {
              return { ...prev, current: candidate };
            }
          }
          return prev;
        });
      };

      const hardDrop = () => {
        setGame(prev => {
          if (prev.status !== "running") return prev;
          let piece = { ...prev.current };
          while (!collides(prev.board, { ...piece, y: piece.y + 1 })) {
            piece = { ...piece, y: piece.y + 1 };
          }
          return lockAndSpawn(prev, piece);
        });
      };

      useEffect(() => {
        const handleKeyDown = (event) => {
          if (event.key === "p" || event.key === "P") {
            event.preventDefault();
            setGame(prev => {
              if (prev.status === "gameover") return prev;
              return { ...prev, status: prev.status === "paused" ? "running" : "paused" };
            });
            return;
          }

          if (game.status !== "running") return;

          const key = event.key;
          if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " ", "x", "X"].includes(key)) {
            event.preventDefault();
          }

          if (key === "ArrowLeft") moveLeft();
          if (key === "ArrowRight") moveRight();
          if (key === "ArrowDown") softDrop();
          if (key === "ArrowUp" || key === "x" || key === "X") rotate();
          if (key === " ") hardDrop();
        };

        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [game.status]);

      useEffect(() => {
        if (game.status !== "running") return;

        const interval = setInterval(() => {
          setGame(prev => {
            if (prev.status !== "running") return prev;
            const dropped = { ...prev.current, y: prev.current.y + 1 };
            if (!collides(prev.board, dropped)) {
              return { ...prev, current: dropped };
            }
            return lockAndSpawn(prev, prev.current);
          });
        }, Math.max(120, 650 - (game.level - 1) * 55));

        return () => clearInterval(interval);
      }, [game.status, game.level]);

      const displayBoard = useMemo(() => {
        const board = cloneBoard(game.board);
        for (let y = 0; y < game.current.matrix.length; y++) {
          for (let x = 0; x < game.current.matrix[y].length; x++) {
            if (!game.current.matrix[y][x]) continue;
            const boardX = game.current.x + x;
            const boardY = game.current.y + y;
            if (boardY >= 0 && boardY < BOARD_HEIGHT && boardX >= 0 && boardX < BOARD_WIDTH) {
              board[boardY][boardX] = game.current.type;
            }
          }
        }
        return board;
      }, [game.board, game.current]);

      const startNewGame = () => {
        setGame({
          board: createEmptyBoard(),
          current: createPiece(),
          next: createPiece(),
          score: 0,
          lines: 0,
          level: 1,
          status: "running",
          best: game.best || 0
        });
      };

      const nextPiecePreview = useMemo(() => {
        const preview = Array.from({ length: 4 }, () => Array(4).fill(null));
        const matrix = game.next.matrix;
        const offsetY = Math.floor((4 - matrix.length) / 2);
        const offsetX = Math.floor((4 - matrix[0].length) / 2);

        for (let y = 0; y < matrix.length; y++) {
          for (let x = 0; x < matrix[y].length; x++) {
            if (matrix[y][x]) preview[y + offsetY][x + offsetX] = game.next.type;
          }
        }
        return preview;
      }, [game.next]);

      return (
        <div className="min-h-screen text-slate-100 flex items-center justify-center p-4">
          <div className="w-full max-w-5xl rounded-3xl border border-slate-700/80 bg-slate-900/80 p-5 shadow-2xl backdrop-blur-md">
            <div className="flex flex-col md:flex-row gap-6 items-center md:items-start justify-center">
              <div className="game-grid rounded-2xl p-2 border border-slate-700">
                <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${BOARD_WIDTH}, minmax(0, 1fr))` }}>
                  {displayBoard.flatMap((row, y) =>
                    row.map((cell, x) => {
                      const type = cell || null;
                      const base = "cell flex items-center justify-center";
                      const color = type ? COLORS[type] : "bg-slate-900/80 border-slate-700";
                      return <div key={`${y}-${x}`} className={`${base} ${color}`} />;
                    })
                  )}
                </div>
              </div>

              <div className="w-full max-w-xs space-y-4">
                <div className="rounded-2xl border border-slate-700 bg-slate-800/80 p-4">
                  <div className="text-xs uppercase tracking-[0.25em] text-cyan-300 mb-3">Score</div>
                  <div className="text-4xl font-black tabular-nums">{game.score}</div>
                  <div className="mt-4 grid grid-cols-2 gap-3 text-sm">
                    <div className="rounded-xl bg-slate-700/80 p-2">
                      <div className="text-slate-300">Lines</div>
                      <div className="text-xl font-bold">{game.lines}</div>
                    </div>
                    <div className="rounded-xl bg-slate-700/80 p-2">
                      <div className="text-slate-300">Level</div>
                      <div className="text-xl font-bold">{game.level}</div>
                    </div>
                  </div>
                </div>

                <div className="rounded-2xl border border-slate-700 bg-slate-800/80 p-4">
                  <div className="text-xs uppercase tracking-[0.25em] text-violet-300 mb-3">Best</div>
                  <div className="text-3xl font-black tabular-nums">{game.best || 0}</div>
                </div>

                <div className="rounded-2xl border border-slate-700 bg-slate-800/80 p-4">
                  <div className="text-xs uppercase tracking-[0.25em] text-amber-300 mb-3">Next</div>
                  <div className="grid grid-cols-4 gap-1 w-28">
                    {nextPiecePreview.flatMap((row, y) =>
                      row.map((cell, x) => {
                        const base = "w-6 h-6 rounded-sm border border-slate-700";
                        const color = cell ? COLORS[cell] : "bg-slate-900/80";
                        return <div key={`${y}-${x}`} className={`${base} ${color}`} />;
                      })
                    )}
                  </div>
                </div>

                <div className="space-y-2">
                  <button onClick={startNewGame} className="w-full rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 transition">
                    New Game
                  </button>

                  <button
                    onClick={() => setGame(prev => {
                      if (prev.status === "gameover") return prev;
                      return { ...prev, status: prev.status === "paused" ? "running" : "paused" };
                    })}
                    className="w-full rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 transition"
                  >
                    {game.status === "paused" ? "Resume" : "Pause"}
                  </button>
                </div>

                <div className="rounded-2xl border border-slate-700 bg-slate-800/80 p-4 text-sm text-slate-300">
                  <div className="font-semibold text-slate-100 mb-2">Controls</div>
                  <ul className="space-y-1">
                    <li>← → : Move</li>
                    <li>↑ or X : Rotate</li>
                    <li>↓ : Soft Drop</li>
                    <li>Space : Hard Drop</li>
                    <li>P : Pause</li>
                  </ul>
                </div>
              </div>
            </div>

            <div className="mt-6 md:hidden">
              <div className="grid grid-cols-3 gap-3 max-w-xs mx-auto">
                <div></div>
                <button className="touch-btn rounded-xl bg-cyan-500 text-slate-950 font-black py-4 text-xl" onClick={rotate}>↻</button>
                <div></div>
                <button className="touch-btn rounded-xl bg-slate-700 text-white font-black py-4 text-xl" onClick={moveLeft}>←</button>
                <button className="touch-btn rounded-xl bg-slate-700 text-white font-black py-4 text-xl" onClick={softDrop}>↓</button>
                <button className="touch-btn rounded-xl bg-slate-700 text-white font-black py-4 text-xl" onClick={moveRight}>→</button>
                <div></div>
                <button className="touch-btn rounded-xl bg-violet-500 text-white font-black py-4 text-xl" onClick={hardDrop}>Drop</button>
                <div></div>
              </div>
            </div>

            {game.status === "gameover" && (
              <div className="fixed inset-0 flex items-center justify-center bg-slate-950/75 backdrop-blur-sm">
                <div className="rounded-3xl border border-red-500/50 bg-slate-900 p-8 text-center shadow-2xl">
                  <div className="text-3xl font-black text-red-400 mb-2">Game Over</div>
                  <div className="text-xl mb-6">Score: {game.score}</div>
                  <button onClick={startNewGame} className="rounded-xl bg-red-500 hover:bg-red-400 text-white font-bold px-6 py-3 transition">
                    Retry
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
